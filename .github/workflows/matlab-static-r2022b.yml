name: MATLAB R2022b Native Static Ground Truth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ground-truth:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB R2022b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b

      - name: Run native static dependency analysis
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath(fullfile(pwd,'code-intelligence','scripts'));
            run_static_ground_truth(pwd, fullfile(pwd,'cloud-static-evidence'));

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-r2022b-native-static-ground-truth
          path: cloud-static-evidence
          if-no-files-found: warn
