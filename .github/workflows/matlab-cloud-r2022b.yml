name: MATLAB R2022b Cloud Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB R2022b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b

      - name: Run MATLAB smoke test
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath(fullfile(pwd,'code-intelligence','scripts'));
            cloud_smoke_test(pwd, fullfile(pwd,'cloud_environment.json'));

      - name: Upload cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-r2022b-cloud-evidence
          path: cloud_environment.json
          if-no-files-found: warn
