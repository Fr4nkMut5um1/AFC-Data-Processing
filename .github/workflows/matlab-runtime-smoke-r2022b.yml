name: MATLAB R2022b Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cases/**'
      - 'lib/**'
      - 'tests/**'
      - 'code-intelligence/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB R2022b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b

      - name: Run bounded runtime smoke tests
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath(fullfile(pwd,'code-intelligence','scripts'));
            run_runtime_smoke(pwd, fullfile(pwd,'cloud-runtime-smoke-evidence'));

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-r2022b-runtime-smoke
          path: cloud-runtime-smoke-evidence
          if-no-files-found: warn
